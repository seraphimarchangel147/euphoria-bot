[project]
name = "euphoria-bot"
version = "0.2.0"
description = "Automated trading bot for Euphoria Finance on MegaETH"
requires-python = ">=3.11"
dependencies = [
    "eth-account>=0.13",
    "httpx[socks]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
